# Development stack: PostgreSQL + the app container.
#
#   docker compose up --build
#
# PROD uses the same app image against a managed Postgres — point DATABASE_URL at
# it and drop the `db` service. Override secrets via a .env file next to this
# compose file (POSTGRES_PASSWORD, JWT_SECRET, CUSTOMER_FIELD_KEY).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devsecret}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"   # exposed for local debugging; remove in PROD

  app:
    build: .
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-devsecret}@db:5432/app
      PORT: "8080"
      NODE_ENV: production
      # Must be >= 32 chars in production or the server refuses to start.
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32-characters!!}
      # 64-char hex key for customer PII encryption. Empty = encryption disabled
      # (plaintext passthrough). Set this in .env to encrypt at rest.
      CUSTOMER_FIELD_KEY: ${CUSTOMER_FIELD_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/server/uploads

volumes:
  pgdata:
  uploads:
