name: CI

on:
  push:
    branches:
      - DEV-2
      - DEV-3
      - dev
      - main
  pull_request:

jobs:
  server:
    name: Server tests and audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: solutionshub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d solutionshub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Run route integration tests on PostgreSQL
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://app:test_password@localhost:5432/solutionshub_test
        run: node --test test/serviceActivities.integration.test.js

      # Several route tests skip themselves on pg-mem (correlated subqueries,
      # join lookups, an internal pg-mem crash) and are meant to run here.
      # They share one database, so run them one file at a time.
      - name: Run PostgreSQL-only route tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://app:test_password@localhost:5432/solutionshub_test
        run: node --test --test-concurrency=1 test/templates.test.js test/notificationsSearch.integration.test.js test/scorecardsSla.test.js test/settingsAndFeeds.test.js

      - name: Check schema and every SQL statement against PostgreSQL
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://app:test_password@localhost:5432/solutionshub_test
        run: node --test test/postgres.schema.test.js

      - name: Audit server production dependencies
        working-directory: server
        run: npm audit --omit=dev

  client:
    name: Client build and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # Correctness rules only (undefined variables, hook rules): errors fail the
      # build, unused-import warnings don't. See client/eslint.config.js.
      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Run client tests
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Run browser tests
        working-directory: client
        run: npm run test:e2e

      - name: Keep browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7

      - name: Audit client production dependencies
        working-directory: client
        run: npm audit --omit=dev

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose config
        run: |
          POSTGRES_PASSWORD=dummy_password \
          JWT_SECRET=dummy_jwt_secret_value_at_least_32_chars \
          CUSTOMER_FIELD_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          ATTACHMENT_KEY=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          APP_URL=http://localhost:8080 \
          docker compose config
